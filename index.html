<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <header class="auth-header">
                <h1>FitTrack</h1>
                <p>Entre com seu usuário para acompanhar suas metas</p>
            </header>

            <form id="login-form">
                <div class="input-group">
                    <label for="usuario">Nome de Usuário</label>
                    <input type="text" id="usuario" placeholder="Digite seu usuário" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <p id="mensagem-erro" class="erro-texto"></p>

                <button type="submit" class="btn-principal">Entrar</button>
            </form>

            <footer class="auth-footer">
                <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </footer>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
