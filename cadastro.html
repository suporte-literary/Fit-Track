<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Criar Conta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <header class="auth-header">
                <h1>Criar Conta</h1>
                <p>Comece a controlar suas calorias, água e treinos</p>
            </header>

            <form id="cadastro-form">
                <div class="input-group">
                    <label for="nome-completo">Nome Completo</label>
                    <input type="text" id="nome-completo" placeholder="Ex: João Silva" required>
                </div>

                <div class="input-group">
                    <label for="novo-usuario">Nome de Usuário (Login)</label>
                    <input type="text" id="novo-usuario" placeholder="Ex: joaosilva" required>
                </div>

                <div class="input-group">
                    <label for="nova-senha">Senha</label>
                    <input type="password" id="nova-senha" placeholder="Crie uma senha" required>
                </div>

                <p id="mensagem-cadastro" class="erro-texto"></p>

                <button type="submit" class="btn-principal">Finalizar Cadastro</button>
            </form>

            <footer class="auth-footer">
                <p>Já possui uma conta? <a href="index.html">Fazer Login</a></p>
            </footer>
        </div>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
